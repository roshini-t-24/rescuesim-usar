# Reference only: the Nebius CLI takes flags, not this file. See deploy_job.ps1 for the working command.
# Platform/preset below are unverified placeholders: pick a CPU platform from
# https://docs.nebius.com/compute/virtual-machines/types and confirm with --dry-run.
name: rescuesim-policy-eval
image: cr.<region>.nebius.cloud/<registry-path>/rescuesim-usar:latest
platform: cpu-d3
preset: 8vcpu-32gb
timeout: 2h
disk_size: 50Gi
container_command: python
args: -m nebius_jobs.batch_policy_eval --episodes 100 --workers 8 --output /results/serverless_eval.json
volume: <bucket-or-filesystem>:/results:rw
